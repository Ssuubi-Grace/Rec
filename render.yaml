# Render Blueprint — ProMISe Recruitment demo (API + SPA + PostgreSQL)

services:
  - type: web
    name: promise-recruitment
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: promise-recruitment-db
          property: connectionString

databases:
  - name: promise-recruitment-db
    plan: free
    databaseName: promise_recruitment
    user: promise_recruitment
