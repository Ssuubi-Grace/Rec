# Render Blueprint — ProMISe Recruitment demo (web service only)
# Reuses your account's existing free Postgres: set DATABASE_URL on the service (see DEPLOY.md).

services:
  - type: web
    name: promise-recruitment
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
